    <title>BookMyTrain - Secure Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {
            min-height: 100vh;
            background: #191970;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            font-weight: bold;
            margin-bottom: 10px;

            font-size: 20px;

            letter-spacing: 8px;

        button {

            padding: 15px;
