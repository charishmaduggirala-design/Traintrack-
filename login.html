<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyTrain - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #5252ac;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #FFF8E7;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .train {
            font-size: 75px;
            margin-bottom: 15px;
        }

        h1 {
            color: #191970;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #5353b7;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            color: #191970;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .send-otp {
            width: 100%;
            padding: 15px;
            background: #191970;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-otp:hover {
            background: #3030a0;
        }

        .register {
            margin-top: 25px;
            color: #5353b7;
            font-size: 14px;
        }

        .register a {
            color: #5353bf;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="train">🚂</div>

        <h1>BOOKMYTRAIN</h1>
        <p class="subtitle">Secure Login</p>

        <form action="/send-otp" method="POST">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <button type="submit" class="send-otp">
                Send OTP
            </button>
        </form>

        <div class="register">
            Don't have an account?
            <a href="/register">Register</a>
        </div>
    </div>
</body>
</html>
