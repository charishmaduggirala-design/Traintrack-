<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TrainTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #5353ad;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #FFF8E7;
        }

        .welcome-container {
            text-align: center;
            padding: 30px 20px;
        }

        .train {
            font-size: 110px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 35px;
            color: #FFF8E7;
        }

        .login-button {
            display: inline-block;
            background: #F3E5AB;
            color: #191970;
            padding: 16px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .login-button:hover {
            background: #FFFFFF;
            transform: scale(1.04);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 29px;
            }

            .train {
                font-size: 80px;
            }
        }
    </style>
</head>

<body>
    <div class="welcome-container">

        <div class="train">🚂</div>

        <h1>WELCOME TO TRAINTRACK</h1>

        <p>Your journey starts here...</p>

        <a href="/login" class="login-button">
            CONTINUE TO LOGIN
        </a>

    </div>
</body>
</html>
